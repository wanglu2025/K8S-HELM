# 说明：以下适用于阿里云生产环境。本次采用2副本，去掉log的持久化存储逻辑，使用sls进行日志存储。

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: xxl-job-admin
  namespace: xxl-job
  labels:
    app: xxl-job-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xxl-job-admin
  template:
    metadata:
      labels:
        app: xxl-job-admin
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: xxl-job-config
            items:
              - key: application.properties
                path: application.properties
            defaultMode: 420
#        - name: logs-volume
#          persistentVolumeClaim:
#            claimName: xxl-job-logs-shared
      containers:
        - name: xxl-job-admin
          image: >-
            crpi-rlo3wv5p9a1d385b.cn-beijing.personal.cr.aliyuncs.com/my_public_base/xuxueli_xxl-job-admin:3.2.0
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xxl-job-secret
                  key: mysql-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xxl-job-secret
                  key: mysql-password
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: xxl-job-secret
                  key: access-token
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config-volume
              readOnly: true
              mountPath: /application.properties
              subPath: application.properties
#            - name: logs-volume
#              mountPath: /data/applogs
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 2
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
kind: Service
apiVersion: v1
metadata:
  name: xxl-job-admin-service
  namespace: xxl-job
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: xxl-job-admin
  type: ClusterIP

---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: xxl-job-admin-ingress
  namespace: xxl-job
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aladdinedu.com
      secretName: tls
  rules:
    - host: aladdinedu.com
      http:
        paths:
          - path: /xxl-job-admin
            pathType: Prefix
            backend:
              service:
                name: xxl-job-admin-service
                port:
                  number: 8080

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: xxl-job-config
  namespace: xxl-job
data:
  application.properties: >+

    ### xxl-job, datasource

    spring.datasource.url=jdbc:mysql://rm-2ze08ce254b53fs72.mysql.rds.aliyuncs.com:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai

    spring.datasource.username=${MYSQL_USERNAME}

    spring.datasource.password=${MYSQL_PASSWORD}

    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



    ### 默认为空，建议开启保证安全性；

    xxl.job.accessToken=${ACCESS_TOKEN}


    ### 调度中心通讯超时时间[选填]，单位秒；默认3s；

    xxl.job.timeout=3

    ### 调度中心国际化配置 [必填]： 默认为 "zh_CN"/中文简体, 可选范围为 "zh_CN"/中文简体, "zh_TC"/中文繁体 and
    "en"/英文；

    xxl.job.i18n=zh_CN

    ## 调度线程池最大线程配置【建议显性配置】

    xxl.job.triggerpool.fast.max=300

    xxl.job.triggerpool.slow.max=200

    ### 调度中心日志表数据保存天数 [默认可能是永久保存，建议配置]：过期日志自动清理；限制大于等于7时生效，否则, 如-1，关闭自动清理功能；

    xxl.job.logretentiondays=30


    ### web

    #server.port=8080

    #server.servlet.context-path=/xxl-job-admin  #前端地址路径

